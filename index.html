<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Random Number</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Number Guessing Game</h1>
    <div class="game">
        <div class="mystery" id="mystery" aria-hidden="true">?</div>
        <label for="guessNumber">I'm thinking of a number from 1 to 10</label>

        <div class="chips" id="chips" role="group" aria-label="Quick pick"></div>

        <input type="number" id="guessNumber" min="1" max="10" placeholder="Enter your guess">
        <input type="button" id="submit" onclick="btnSubmitOnAction()" value="Check my guess">
        <p id="p1"></p>
        <input type="button" id="reset" onclick="newGame()" value="Start a new game">
    </div>

    <div class="images">
        <img id="correctImage" src="https://imgs.search.brave.com/3rRUDptdFl_0O1Q-_p2QzJx4kI09ObQhgAXum-4smBA/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly93YW5u/aS53b3JkcHJlc3Mu/Y29tL3dwLWNvbnRl/bnQvdXBsb2Fkcy8y/MDE5LzEwL3Nhaml0/aC1wcmVtYWRhc2Et/Mi5qcGc_dz0xMDI0" alt="Sajith Premadasa" width="300" height="400" style="display: none;">
        <img id="wrongImage" src="https://imgs.search.brave.com/Gi2vt4IMqwsCrikAvoTXkt6egj63gSPJFig1e9ovJQ0/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWFn/ZXMuY25iY3R2MTgu/Y29tL3VwbG9hZHMv/MjAyMi8wNy9TYWpp/dGgtUHJlbWFkYXNh/LmpwZz9pbXBvbGlj/eT13ZWJzaXRlJndp/ZHRoPTY0MCZoZWln/aHQ9MzYw" alt="Wrong guess" width="300" height="400" style="display: none;">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="index.js"></script>
</body>

</html>
